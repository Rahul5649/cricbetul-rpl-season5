<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRICBETUL RPL S5 · OBS Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}.lower{position:absolute;left:4%;right:4%;bottom:5%;height:150px;display:grid;grid-template-columns:230px 1fr 310px;align-items:stretch;filter:drop-shadow(0 8px 20px #0008)}.brand{background:#07170e;border:2px solid #c9ff38;display:flex;align-items:center;justify-content:center;flex-direction:column}.crest{border:2px solid #c9ff38;border-radius:50%;height:62px;width:62px;object-fit:cover}.brand b{letter-spacing:3px;font-size:18px;margin-top:8px}.cb-logo{width:126px;max-height:34px;object-fit:contain;margin-top:4px}.player{background:linear-gradient(90deg,#102519f5,#0a1c12f5);border-top:2px solid #c9ff38;border-bottom:2px solid #c9ff38;padding:17px 24px;display:flex;flex-direction:column;justify-content:center}.kicker{color:#c9ff38;font-weight:900;letter-spacing:3px;font-size:12px}.name{font-size:34px;font-weight:900;line-height:1.1;margin-top:5px}.meta{font-size:14px;color:#bac8b5;margin-top:6px}.bid{background:#c9ff38;color:#08150a;display:flex;flex-direction:column;align-items:center;justify-content:center}.bid small{font-size:12px;font-weight:900;letter-spacing:2px}.bid strong{font-size:35px;font-weight:1000;line-height:1.1;margin:5px 0}.bid span{font-size:13px;font-weight:900}.hidden{opacity:0}@media(max-width:900px){.crest{height:40px;width:40px}.cb-logo{width:78px;max-height:20px}.lower{height:85px;grid-template-columns:120px 1fr 170px}.crest{height:35px;width:35px;font-size:11px}.brand b{font-size:11px}.player{padding:8px 12px}.kicker{font-size:8px}.name{font-size:20px}.meta{font-size:9px}.bid small{font-size:8px}.bid strong{font-size:21px}.bid span{font-size:9px}}
</style></head><body><div class="lower" id="lower"><div class="brand"><img class="crest" src="assets/rpl-season5.jpg" alt="RPL S5"><img class="cb-logo" src="assets/cricbetul-logo.webp" alt="CRICBETUL"></div><div class="player"><div class="kicker" id="kicker">RPL SEASON 5 · 2026–27</div><div class="name" id="name">RAGHUVANSHI PREMIER LEAGUE</div><div class="meta" id="meta">Official digital & live broadcast partner</div></div><div class="bid"><small id="label">AUCTION UPDATE</small><strong id="amount">RPL S5</strong><span id="team">LIVE ON CRICBETUL</span></div></div>
<script>
const KEY='cricbetul_rpl_s5_state_v1',API='/.netlify/functions/api';const $=s=>document.querySelector(s);function read(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}function money(v){return v==null||v===''?'—':'₹'+Number(v).toLocaleString('en-IN')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(s){const a=s.auction||{},p=(s.players||[]).find(x=>x.id===a.playerId),t=(s.teams||[]).find(x=>x.id===a.teamId);if(!p){$('#kicker').textContent='RPL SEASON 5 · 2026–27';$('#name').textContent='RAGHUVANSHI PREMIER LEAGUE';$('#meta').textContent='Official digital & live broadcast partner';$('#label').textContent='AUCTION UPDATE';$('#amount').textContent='RPL S5';$('#team').textContent='LIVE ON CRICBETUL';return}$('#kicker').textContent=a.status==='sold'?'PLAYER SOLD':a.status==='unsold'?'PLAYER UNSOLD':'LIVE AUCTION · LOT';$('#name').textContent=esc(p.name).toUpperCase();$('#meta').textContent=[p.village,p.role,p.regId].filter(Boolean).map(esc).join(' · ');$('#label').textContent=a.status==='sold'?'SOLD FOR':a.currentBid>0?'CURRENT BID':'BASE PRICE';$('#amount').textContent=money(a.status==='sold'?p.soldPrice:(a.currentBid>0?a.currentBid:(p.basePrice??a.basePrice)));$('#team').textContent=t?esc(t.name):a.status==='sold'?'SOLD':a.status==='unsold'?'UNSOLD':'BIDDING OPEN'}
async function refresh(){try{const r=await fetch(API+'?resource=public');if(r.ok){const j=await r.json();if(j.backend){render(j.state);return}}}catch{}render(read())}refresh();setInterval(refresh,1000);if('BroadcastChannel'in window){new BroadcastChannel('rpl-s5-live').onmessage=refresh}
</script></body></html>

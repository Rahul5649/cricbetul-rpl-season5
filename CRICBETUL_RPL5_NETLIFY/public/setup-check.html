<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07140d"><title>RPL Season 5 · Setup Check</title><style>:root{color-scheme:dark;--bg:#07140d;--panel:#0c2115;--line:#425b2d;--lime:#c9ff38;--text:#f4f7ef;--muted:#a4b5a1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1d3c24,transparent 38%),var(--bg);color:var(--text);font:15px/1.6 system-ui,Arial,sans-serif}.wrap{width:min(760px,calc(100% - 28px));margin:36px auto}.card{padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}h1{font-size:clamp(24px,5vw,38px);margin:0 0 4px}p{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #29412a}.row:last-child{border:0}.tag{color:var(--lime);font-size:12px;font-weight:800}.status{font-weight:800}.ok{color:#c9ff38}.bad{color:#ff9b8d}.warn{color:#f1cf78}button,a.btn{display:inline-block;padding:11px 16px;background:var(--lime);color:#10200c;border:0;border-radius:8px;font-weight:850;text-decoration:none;cursor:pointer;margin:8px 8px 0 0}code{overflow-wrap:anywhere;color:#e2f3cf}.small{font-size:12px;color:var(--muted)}</style></head><body><main class="wrap"><div class="card"><div class="tag">CRICBETUL × RPL SEASON 5</div><h1>Deployment Status Check</h1><p>यह पेज जाँचता है कि Netlify Functions और persistent database उपलब्ध हैं या नहीं।</p><div id="results"><div class="row"><span>Checking API…</span><span class="status warn">WAIT</span></div></div><button id="retry">फिर से जाँचें</button><a class="btn" href="/">मुख्य वेबसाइट</a><p class="small">इस पेज पर कोई password या secret दर्ज न करें।</p></div></main><script>const results=document.getElementById('results');async function run(){results.innerHTML='<div class="row"><span>Database status</span><span class="status warn">जाँच जारी…</span></div>';try{const r=await fetch('/.netlify/functions/api?resource=health',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'API error');results.innerHTML=`<div class="row"><span>Netlify Function</span><span class="status ok">Connected</span></div><div class="row"><span>Persistent PostgreSQL</span><span class="status ok">${d.database==='connected'?'Connected':'Not connected'}</span></div><div class="row"><span>Media storage</span><span class="status ok">${d.media||'Not confirmed'}</span></div><div class="row"><span>Organizer login secret</span><span class="status ${d.adminReady?'ok':'bad'}">${d.adminReady?'Configured':'Not configured'}</span></div>`}catch(e){results.innerHTML=`<div class="row"><span>Deployment / database</span><span class="status bad">Not ready</span></div><p class="small">${String(e.message).replace(/[<>&]/g,'')}</p><p class="small">Git-linked deploy, Netlify Database provisioning, migration and function deployment check करें।</p>`}}document.getElementById('retry').onclick=run;run();</script></body></html>

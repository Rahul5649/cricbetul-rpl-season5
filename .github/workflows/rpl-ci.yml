name: RPL Season 5 CI

on:
  push:
    branches: [main, ready-to-deploy]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CRICBETUL_RPL5_NETLIFY
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run project smoke tests
        run: npm test
